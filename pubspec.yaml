name: maacotas
description: MaaCOTAS - Dog Owner App for managing your pets health and happiness
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^13.0.0

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4

  # Ads
  google_mobile_ads: ^5.1.0

  # Charts
  fl_chart: ^0.68.0

  # Image Picker
  image_picker: ^1.1.2

  # Internationalization
  intl: ^0.19.0

  # Utilities
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Icons
  font_awesome_flutter: ^10.7.0

  # Other
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
